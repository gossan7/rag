[project]
name = "rag"
version = "0.1.0"
description = "Rag cli"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "chromadb>=1.5.9",
    "diskcache>=5.6.3",
    "dotenv>=0.9.9",
    "fastapi>=0.143.0",
    "fire>=0.7.1",
    "langchain-text-splitters",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "sentence-transformers[openvino]==6.1.0",
    "tantivy>=0.26.0",
    "tqdm>=4.70.0",
    "transformers>=5.0,<5.6",
    "uvicorn>=0.52.1",
    "xapian-bindings-binary==1.4.26",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["fire", "xapian"]
ignore_missing_imports = true

[tool.uv.sources]
langchain-text-splitters = { git = "https://github.com/langchain-ai/langchain", subdirectory = "libs/text-splitters", rev = "fd822b07c" }

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.3.1",
    "snakeviz>=2.2.2",
    "types-pyyaml>=6.0.12.20260906",
    "types-tqdm>=4.70.0.20260906",
]
