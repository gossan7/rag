[project]
name = "rag"
version = "0.1.0"
description = "Rag cli"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "chromadb>=1.5.9",
    "fire>=0.7.1",
    "langchain-text-splitters>=1.1.2",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.1.0",
    "tantivy>=0.26.0",
    "tqdm>=4.70.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[[tool.mypy.overrides]]
module = ["fire"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.3.1",
    "snakeviz>=2.2.2",
    "types-pyyaml>=6.0.12.20260906",
    "types-tqdm>=4.70.0.20260906",
]
