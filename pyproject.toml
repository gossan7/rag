[project]
name = "rag"
version = "0.1.0"
description = "Rag cli"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "bm25s>=0.3.9",
    "fire>=0.7.1",
    "mypy>=2.1.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260518",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[[tool.mypy.overrides]]
module = ["fire"]
ignore_missing_imports = true
