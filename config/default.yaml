# Config for RagCLI

# Specifies path for: files to process, directory to save index, datasets, and output.
# Do not change unless you know what you're doing
paths:
  raw: "data/raw"
  processed: "data/processed"
  datasets: "data/datasets"
  output: "data/output"


# Specifies which file types will be processed, which directories to exclude, and which chunking method is used.
# Available chunking methods are: ast (python only), langchain, window
indexing:
  excludes: [__pycache__, .git, .venv]
  file_types:
    .py:
      chunking_method: "ast"
      enabled: true
    .md:
      chunking_method: "langchain"
      enabled: false
    .txt:
      chunking_method: "langchain"
      enabled: false


# Specifies which backend will be used for both indexing and searching.
# Multiple backends can be enabled. The score used for search would then be the weighted sum of each normalized scores.
retrieval:
  backends:
    tfidf:
      enabled: false
      weight: 1.0
      path: "tfidf"
    bm25:
      enabled: true
      weight: 1.0
      path: "bm25"
    minilm:
      enabled: false
      weight: 1.0
      path: "minilm"


# Enables auto-translate in english for queries. Can make results worse if precise words are needed.
# If enabled and the query is already in english, nothing will be made.
search:
  auto_translate: false


# Specifies which model to use for generation. Also specifies the maximum context length.
# The context length cannot be more than 20 000.
answer:
  model_name: Qwen/Qwen3-0.6B
  max_context_length: 10000
